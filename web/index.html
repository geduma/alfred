<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alfred — Panel</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#4f8cff">
  <meta name="theme-color" content="#12161d">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Alfred <span class="subtitle">— Control panel</span></h1>
    <div class="connection">
      <span id="conn-dot" class="dot offline"></span>
      <span id="conn-label">Disconnected</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="chat">Chat</button>
    <button class="tab" data-tab="metrics">Metrics</button>
  </nav>

  <main>
    <section id="tab-chat" class="tab-panel active">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Type your message..." autofocus>
        <button type="submit">Send</button>
      </form>
    </section>

    <section id="tab-metrics" class="tab-panel">
      <div class="metrics-header">
        <p id="metrics-status" class="metrics-status">Waiting for data…</p>
      </div>
      <div id="metrics-grid" class="metrics-grid"></div>
    </section>
  </main>

  <script src="js/ws-client.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/metrics.js"></script>
</body>
</html>
