<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Alfred Control Center — chat and live telemetry">
  <title>Alfred — Control Center</title>
  <link rel="icon" href="/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/img/site.webmanifest">
  <link rel="mask-icon" href="/img/safari-pinned-tab.svg" color="#34d399">
  <meta name="theme-color" content="#0a0c10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="/img/favicon.svg" alt="Alfred logo" width="32" height="32">
      <div class="brand-text">
        <h1>Alfred</h1>
        <span class="subtitle">Control Center</span>
      </div>
    </div>
    <div class="top-actions">
      <button id="toggle-left" class="ghost-btn" aria-label="Toggle telemetry panel" aria-pressed="true" title="Telemetry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <button id="toggle-right" class="ghost-btn" aria-label="Toggle context panel" aria-pressed="true" title="Context">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      </button>
    </div>
    <div class="top-stats">
      <span class="stat" title="Active model">Model <em id="hdr-model-v">—</em></span>
      <span class="stat" title="Latency">Latency <em id="hdr-latency-v">—</em></span>
      <span class="stat" title="Uptime">Uptime <em id="hdr-uptime-v">—</em></span>
      <div class="connection" role="status">
        <span id="conn-dot" class="dot offline"></span>
        <span id="conn-label">Disconnected</span>
      </div>
    </div>
  </header>

  <div id="conn-banner" class="conn-banner hidden" role="alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span>Disconnected. Reconnecting…</span>
  </div>

  <nav class="mobile-tabs" aria-label="Panels">
    <button class="mtab" data-panel="left">Telemetry</button>
    <button class="mtab active" data-panel="center">Chat</button>
    <button class="mtab" data-panel="right">Context</button>
  </nav>

  <main class="grid">
    <aside id="panel-left" class="col-left" aria-label="Telemetry">
      <div class="panel-head">
        <h2>Telemetry</h2>
        <div id="metrics-status" class="metrics-status">Waiting for data…</div>
      </div>
      <div id="metrics-grid" class="metrics-grid"></div>
    </aside>

    <section id="panel-center" class="col-center mobile-open" aria-label="Chat">
      <div id="messages" class="messages" aria-live="polite" aria-label="Conversation"></div>
      <div id="input-bar" class="input-bar">
        <div id="rec-indicator" class="rec-indicator hidden" role="status">
          <span class="rec-dot"></span>
          <span id="rec-timer">0:00</span>
          <span class="rec-label">REC</span>
        </div>
        <div id="attachments" class="attachments"></div>
        <div class="input-row">
          <button id="btn-mic" class="icon-btn" title="Record voice" aria-label="Record voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
          <button id="btn-attach" class="icon-btn" title="Attach file" aria-label="Attach file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
          <input type="file" id="file-input" hidden
                 accept=".png,.jpg,.jpeg,.gif,.pdf,.wav,.ogg,.mp3,.m4a,.webm,.txt,.md,.csv,.json,.log">
          <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
          <input type="file" id="audio-input" accept="audio/*" capture hidden>
          <button id="btn-camera" class="icon-btn mobile-only" title="Camera" aria-label="Camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
          <textarea id="chat-input" rows="1" placeholder="Message Alfred…" maxlength="3000" aria-label="Message Alfred"></textarea>
          <button id="btn-send" class="send-btn" disabled aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
        </div>
        <div class="input-status">
          <span id="input-status-text">Ready</span>
          <span id="char-count" class="mono">0/3000</span>
        </div>
      </div>
    </section>

    <aside id="panel-right" class="col-right" aria-label="Context">
      <div class="panel-head">
        <h2>Context</h2>
      </div>
      <div id="context-grid" class="context-grid"></div>
    </aside>
  </main>

  <script src="js/ws-client.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/context.js"></script>
  <script src="js/audio-recorder.js"></script>
  <script src="js/file-uploader.js"></script>
  <script src="js/input-bar.js"></script>
</body>
</html>
