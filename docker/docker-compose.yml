name: alfred

services:
  alfred:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: alfred-agent
    hostname: alfred
    restart: unless-stopped

    ports:
      - "127.0.0.1:18789:18789"

    stdin_open: true
    tty: true

    volumes:
      - ~/.alfred:/workspace

    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKSPACE: /workspace
      CONFIG_PATH: /workspace/config/alfred.json

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
