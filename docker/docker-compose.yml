name: alfred

services:
  alfred:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: alfred-agent
    hostname: alfred
    restart: unless-stopped

    # Host networking: the gateway binds 0.0.0.0:18789 (server.host) directly on the
    # host interfaces, so it is reachable at http://<HOST-LAN-IP>:18789 and the
    # container sees the real client IPs — required for channels.web.permissions.allow_from.
    # (Linux only; on Docker Desktop use port mapping instead.)
    network_mode: host

    stdin_open: true
    tty: true

    volumes:
      - ~/.alfred:/workspace

    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKSPACE: /workspace
      CONFIG_PATH: /workspace/config/alfred.json

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
